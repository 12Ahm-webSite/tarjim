# Heap capped for small CI containers (FlutLab): the Flutter template
# default of -Xmx8G gets the Gradle daemon OOM-killed there.
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# AGP 8.7.3 is not yet tested against compileSdk 36 — suppress the warning.
android.suppressUnsupportedCompileSdk=36
